<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دليل الأسماء والأرقام</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4fd8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#6b7280;--primary:#1e4fd8;--primary-t:#fff;--line:#e3e7f0;--soft:#eaf0ff;--ok:#0f9d58;--err:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--text:#eef1fa;--muted:#9aa4bf;--primary:#5b8cff;--primary-t:#0b1020;--line:#26304d;--soft:#1d2a4d;--ok:#4cc38a;--err:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:18px 0 14px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--primary);color:var(--primary-t);display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
h1{font-size:24px;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.total{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:14px;color:var(--muted)}
.total b{font-size:22px;color:var(--primary);line-height:1;font-variant-numeric:tabular-nums}
.total .live{margin:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:14px;margin:16px 0}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:11px 4px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--primary);color:var(--primary-t)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;outline:none}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft)}
label{display:block;font-weight:500;font-size:14px;margin-top:14px}
label:first-child{margin-top:0}
.btn{width:100%;margin-top:18px;border:0;background:var(--primary);color:var(--primary-t);font:inherit;font-weight:700;padding:13px;border-radius:12px;cursor:pointer}
.btn:disabled{opacity:.6}
.count{color:var(--muted);font-size:13px;margin:14px 4px 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:18px}
.info{flex:1;min-width:0}
.nm{font-weight:700}
.rl{color:var(--muted);font-size:13px}
.ph{direction:ltr;text-align:right;color:var(--muted);font-size:13px}
.item{flex-wrap:wrap}.info{min-width:140px}
.btns{flex:none;display:flex;gap:6px}
.act{text-decoration:none;font-weight:700;font-size:13px;padding:9px 13px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.wa{background:#25d366;color:#fff}.tel{background:var(--soft);color:var(--primary)}
.prow{display:flex;flex-direction:row-reverse;gap:8px;margin-top:6px}.prow select{width:128px;flex:none;margin-top:0;appearance:auto;padding:12px 8px}.prow input{flex:1;margin-top:0}
@media(max-width:480px){.btns{width:100%}.btns .act{flex:1}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.msg{margin-top:12px;text-align:center;font-size:14px;min-height:20px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.hide{display:none}
select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;outline:none}
.hint{color:var(--muted);font-size:13px;margin:0 0 4px}
.drop{display:block;text-align:center;border:2px dashed var(--primary);border-radius:14px;padding:22px 10px;margin-top:16px;cursor:pointer;color:var(--primary);font-weight:700;background:var(--soft)}
.sum{margin-top:16px;font-weight:700}
.sample{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.sample li{padding:5px 0;border-bottom:1px solid var(--line)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">☎</div>
  <h1>دليل الأسماء والأرقام</h1>
  <p>ابحث عن أي اسم أو منصب، أو أضف جهة اتصال جديدة</p>
  <div class="total" aria-live="polite"><span class="live"></span><span>إجمالي الأسماء المضافة</span><b id="total">…</b></div>
</header>

<div class="tabs">
  <button class="tab on" id="t-search">🔍 بحث</button>
  <button class="tab" id="t-add">➕ إضافة</button>
  <button class="tab" id="t-imp">📥 استيراد</button>
</div>

<section id="v-search">
  <input id="q" type="search" placeholder="اكتب اسمًا أو منصبًا أو رقمًا…" autocomplete="off" style="margin-top:0">
  <div class="count" id="count"></div>
  <div id="list"><div class="empty">جارٍ التحميل…</div></div>
</section>

<section id="v-add" class="hide">
  <div class="card">
    <label for="n">الاسم</label>
    <input id="n" maxlength="80" placeholder="مثال: الفريق أحمد الخفاجي" autocomplete="off">
    <label for="r">المنصب</label>
    <input id="r" maxlength="80" placeholder="مثال: مدير مكتب الوزير" autocomplete="off">
    <label for="p">رقم الهاتف</label>
    <div class="prow">
      <select id="cc" aria-label="رمز البلد" dir="ltr" disabled style="opacity:1;appearance:none;-webkit-appearance:none;text-align:center"><option value="964" selected>🇮🇶 +964</option></select>
      <input id="p" type="tel" inputmode="tel" maxlength="20" placeholder="7501234567" dir="ltr" style="text-align:right" autocomplete="off">
    </div>
    <button class="btn" id="save">حفظ جهة الاتصال</button>
    <div class="msg" id="msg"></div>
  </div>
</section>

<section id="v-imp" class="hide">
  <div class="card">
    <h2 style="margin:0 0 6px;font-size:17px">📥 استيراد جهات اتصال من ملف</h2>
    <p class="hint">الملفات المدعومة: Excel ‏(xlsx / xls) و CSV وبطاقات الاتصال VCF. يتعرف الموقع تلقائيًا على أعمدة الاسم والرقم والمنصب (إن وُجد)، وتُضاف الأسماء للجميع فورًا.</p>
    <label for="icc">رمز البلد للأرقام التي بلا رمز دولي</label>
    <select id="icc" dir="ltr" disabled style="opacity:1;appearance:none;-webkit-appearance:none"><option value="964" selected>🇮🇶 العراق (+964)</option></select>
    <label class="drop" for="file">📂 اضغط لاختيار ملف</label>
    <input id="file" type="file" accept=".vcf,.vcs,.xlsx,.xls,.xlsm,.ods,.csv" hidden>
    <div id="ipreview"></div>
    <div class="msg" id="imsg"></div>
  </div>
</section>
</div>

<script src="/import.js"></script>
<script>
(function(){
  var contacts = [], ready = false, failed = false;
  var $ = function(id){return document.getElementById(id)};

  function norm(s){
    return String(s||'').toLowerCase()
      .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
      .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
      .replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632});
  }

  function digits(s){ return String(s||'').replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/\D/g,''); }
  // الرقم الدولي للروابط (يدعم الأرقام القديمة المحفوظة بدون رمز البلد)
  function intl(phone){
    var p=String(phone||'').trim(), d=digits(p);
    if(p.charAt(0)==='+') return d;
    if(d.indexOf('00')===0) return d.slice(2);
    if(d.charAt(0)==='0') return '964'+d.replace(/^0+/,'');
    return d.indexOf('964')===0 ? d : '964'+d;
  }
  function buildPhone(cc, local){
    var t=String(local||'').replace(/[\s\-().]/g,'').replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}), full;
    if(/^(\+|00)/.test(t)) full=digits(t).replace(/^00/,'');
    else full=cc+digits(t).replace(/^0+/,'');
    return /^[1-9]\d{7,14}$/.test(full) ? '+'+full : '';
  }

  function render(){
    var q = norm($('q').value.trim()), list = $('list');
    var res = contacts.filter(function(c){
      var qd=digits(q).replace(/^0+/,'');
      return !q || norm(c.name).indexOf(q)>-1 || norm(c.role).indexOf(q)>-1 || norm(c.phone).indexOf(q)>-1 || (qd.length>=3 && intl(c.phone).indexOf(qd)>-1);
    });
    $('total').textContent = ready && !failed ? contacts.length.toLocaleString('en-US') : '…';
    var MAX = 100, total = res.length, more = total > MAX;
    if(more) res = res.slice(0, MAX);
    $('count').textContent = !ready ? '' : q ? 'نتائج البحث: ' + total + (more ? ' (يظهر أول ' + MAX + ' — دقّق البحث لتضييق النتائج)' : '')
      : (more ? 'يظهر أول ' + MAX + ' فقط — ابحث بالاسم أو الرقم لإظهار البقية' : '');
    list.textContent = '';
    if(!res.length){
      var e = document.createElement('div'); e.className='empty';
      e.textContent = failed ? 'تعذّر تحميل البيانات' : !ready ? 'جارٍ التحميل…' : (contacts.length ? 'لا توجد نتائج مطابقة' : 'لا توجد جهات اتصال بعد. أضف أول جهة!');
      list.appendChild(e); return;
    }
    res.forEach(function(c){
      var it = document.createElement('div'); it.className='item';
      var av = document.createElement('div'); av.className='av'; av.textContent = (c.name||'?').trim().charAt(0);
      var info = document.createElement('div'); info.className='info';
      var nm = document.createElement('div'); nm.className='nm'; nm.textContent = c.name;
      var rl = document.createElement('div'); rl.className='rl'; rl.textContent = c.role || '';
      var ph = document.createElement('div'); ph.className='ph'; ph.textContent = '+' + intl(c.phone);
      info.appendChild(nm); info.appendChild(rl); info.appendChild(ph);
      var num = intl(c.phone), btns = document.createElement('div'); btns.className='btns';
      var wa = document.createElement('a'); wa.className='act wa'; wa.textContent='💬 واتساب';
      wa.href = 'https://wa.me/' + num; wa.target='_blank'; wa.rel='noopener noreferrer';
      var tl = document.createElement('a'); tl.className='act tel'; tl.textContent='📞 اتصال';
      tl.href = 'tel:+' + num;
      btns.appendChild(wa); btns.appendChild(tl);
      it.appendChild(av); it.appendChild(info); it.appendChild(btns);
      list.appendChild(it);
    });
  }

  function show(which){
    ['s','a','i'].forEach(function(k){
      $({s:'v-search',a:'v-add',i:'v-imp'}[k]).classList.toggle('hide', which!==k);
      $({s:'t-search',a:'t-add',i:'t-imp'}[k]).classList.toggle('on', which===k);
    });
  }
  $('t-search').onclick = function(){show('s')};
  $('t-add').onclick = function(){show('a')};
  $('t-imp').onclick = function(){show('i')};
  $('q').addEventListener('input', render);

  function msg(t, ok){ var m=$('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); }

  function load(){
    fetch('/api/contacts').then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){ contacts=d; ready=true; failed=false; render(); })
      .catch(function(){ ready=true; failed=true; render(); });
  }

  $('save').onclick = function(){
    var name=$('n').value.trim(), role=$('r').value.trim(), local=$('p').value.trim();
    if(!name||!role||!local){ msg('يرجى تعبئة جميع الحقول',false); return; }
    var phone=buildPhone($('cc').value, local);
    if(!phone){ msg('رقم الهاتف غير صالح',false); return; }
    var b=$('save'); b.disabled=true;
    fetch('/api/contacts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,role:role,phone:phone})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||''); return j; }); })
      .then(function(c){
        contacts.unshift(c); render();
        $('n').value=$('r').value=$('p').value='';
        msg('تمت إضافة جهة الاتصال بنجاح ✓',true);
      })
      .catch(function(e){ msg(e.message||'تعذّر الحفظ، حاول مرة أخرى',false); })
      .then(function(){ b.disabled=false; });
  };

  /* ---------- الاستيراد ---------- */
  var impRows = null;
  function imsg(t, cls){ var m=$('imsg'); m.textContent=t||''; m.className='msg'+(cls?' '+cls:''); }
  function resetImport(){ impRows=null; $('ipreview').textContent=''; }

  function renderPreview(){
    var box=$('ipreview'); box.textContent='';
    if(!impRows) return;
    var f=ContactImport.finalize(impRows.rows, $('icc').value), list=f.list;
    if(!list.length){ imsg('لم أجد أرقامًا صالحة في الملف','err'); return; }
    imsg('');
    var over = list.length>1000, send = over ? list.slice(0,1000) : list;
    var sum=document.createElement('div'); sum.className='sum';
    sum.textContent='تم التعرف على '+list.length+' جهة اتصال'+(f.invalid||f.dup||impRows.skipped?' (تم تجاهل '+(f.invalid+f.dup+impRows.skipped)+' غير صالح أو مكرر)':'');
    box.appendChild(sum);
    var ul=document.createElement('ul'); ul.className='sample';
    list.slice(0,5).forEach(function(c){
      var li=document.createElement('li'); li.textContent=c.name+(c.role?' — '+c.role:'')+' — '+c.phone; ul.appendChild(li);
    });
    box.appendChild(ul);
    if(over){ var w=document.createElement('div'); w.className='hint'; w.style.marginTop='8px'; w.textContent='الحد الأقصى 1000 جهة في المرة، سيُضاف أول 1000 فقط.'; box.appendChild(w); }
    var b=document.createElement('button'); b.className='btn'; b.textContent='إضافة '+send.length+' جهة اتصال للجميع';
    b.onclick=function(){
      b.disabled=true; imsg('جارٍ الإضافة…');
      ContactImport.upload('/api/contacts/import', send).then(function(r){
        resetImport(); load();
        imsg('تمت إضافة '+r.added+' جهة اتصال'+(r.duplicates?' • '+r.duplicates+' موجودة مسبقًا':'')+(r.invalid?' • '+r.invalid+' غير صالحة':'')+' ✓','ok');
      }).catch(function(e){ b.disabled=false; imsg(e.message,'err'); });
    };
    box.appendChild(b);
  }
  $('icc').onchange = renderPreview;
  $('file').onchange = function(){
    var f=this.files[0]; this.value=''; if(!f) return;
    resetImport(); imsg('جارٍ قراءة الملف…');
    ContactImport.parseFile(f).then(function(r){ impRows=r; renderPreview(); })
      .catch(function(e){ resetImport(); imsg(e.message||'تعذّرت قراءة الملف','err'); });
  };

  /* ---------- التزامن الفوري ---------- */
  var tmr=null;
  function refreshSoon(){ clearTimeout(tmr); tmr=setTimeout(load,250); }
  if(window.EventSource){
    var es=new EventSource('/api/events');
    es.addEventListener('change', refreshSoon);
    es.onopen = function(){ load(); };
  }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });

  render(); load();
  // احتياط إذا انقطع الاتصال الفوري
  setInterval(function(){ if(!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
