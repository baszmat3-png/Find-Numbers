services:
  - type: web
    name: contacts-directory
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contacts-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_PATH   # سيطلب منك Render إدخاله عند النشر، مثال: panel-x7k29qd
        sync: false

databases:
  - name: contacts-db
    plan: free
