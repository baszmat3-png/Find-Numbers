services:
  - type: web
    name: contacts-directory
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # رابط PostgreSQL الموجود عندك مسبقًا (Internal Database URL من صفحة القاعدة في Render)
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_PATH   # سيطلب منك Render إدخاله عند النشر، مثال: panel-x7k29qd
        sync: false
